name: 按板型构建并发布
run-name: RKdev 构建 ${{ inputs.board }} · ${{ inputs.profile }}

on:
  workflow_dispatch:
    inputs:
      board:
        description: 要构建的板型
        type: choice
        required: true
        options:
          - bdy-g98
          - phx-r3588
          - 9tripod-i3588
          - aiui-3588
          - aiot-3588a2
          - bearkey-bq3588c
      profile:
        description: 启动介质（default 使用板包默认值）
        type: choice
        required: true
        default: default
        options:
          - default
          - spi
          - emmc
      publish:
        description: 构建成功后发布
        type: boolean
        default: true
      firmware_bundle_url:
        description: 外部固件 ZIP 的 HTTPS 地址（可选）
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: 构建 ${{ inputs.board }}
    runs-on: ${{ inputs.board == 'bearkey-bq3588c' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 80
    env:
      RKDEV_BOARD: ${{ inputs.board }}
      RKDEV_PROFILE_INPUT: ${{ inputs.profile }}
    outputs:
      profile: ${{ steps.firmware.outputs.profile }}
      board_id: ${{ steps.image.outputs.board_id }}
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.version.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-rkdev
      - name: Lint selected board package
        shell: bash
        run: |
          args=(lint --board "boards/$RKDEV_BOARD/v1")
          if [[ "$RKDEV_PROFILE_INPUT" != default ]]; then
            args+=(--profile "$RKDEV_PROFILE_INPUT")
          fi
          python3 .rkdev/tools/rkdev.py "${args[@]}"
      - name: Resolve profile and verify board firmware
        id: firmware
        env:
          RKDEV_FIRMWARE_BUNDLE_URL: ${{ inputs.firmware_bundle_url || secrets.RKDEV_FIRMWARE_BUNDLE_URL }}
        run: |
          profile=$(python3 ci/firmware_bundle.py --rkdev .rkdev --board "boards/$RKDEV_BOARD/v1" \
            --profile "$RKDEV_PROFILE_INPUT" --out "$RUNNER_TEMP/firmware")
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - name: Resolve build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RKDEV_PROFILE: ${{ steps.firmware.outputs.profile }}
        run: python3 ci/build_version.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: .rkdev/recovery/app/go.mod
          cache-dependency-path: .rkdev/recovery/app/go.sum
      - uses: docker/setup-qemu-action@v3
        if: inputs.board == 'bearkey-bq3588c'
        with:
          platforms: arm64
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl bc bison flex \
            libssl-dev libgnutls28-dev libelf-dev libncurses-dev pkg-config \
            device-tree-compiler python3-dev python3-pyelftools python3-setuptools swig \
            u-boot-tools gdisk util-linux e2fsprogs cpio pigz xz-utils lz4 kmod zstd rsync
          if [[ "$RKDEV_BOARD" == bearkey-bq3588c ]]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          fi
      - name: Build U-Boot and recovery image
        id: image
        env:
          RKDEV_PROFILE: ${{ steps.firmware.outputs.profile }}
          RKDEV_VERSION: ${{ steps.version.outputs.version }}
          RKDEV_BUILD_DATE: ${{ steps.version.outputs.build_date }}
        shell: bash
        run: |
          version=$RKDEV_VERSION
          git check-ref-format "refs/tags/$RKDEV_BOARD-$RKDEV_PROFILE-v$version"
          board="boards/$RKDEV_BOARD/v1"
          cross=
          if [[ "$RKDEV_BOARD" == bearkey-bq3588c ]]; then
            cross=aarch64-linux-gnu-
          fi
          mkdir -p out
          sudo env "PATH=$PATH" "RKDEV_BUILD_DATE=$RKDEV_BUILD_DATE" python3 -u .rkdev/tools/rkdev.py build --locked \
            --board "$board" --profile "$RKDEV_PROFILE" --version "$version" --cross-compile="$cross" \
            --firmware-dir "$RUNNER_TEMP/firmware" --jobs "$(nproc)" --out out \
            2>&1 | tee out/build.log
          board_id=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["board_id"])' "$board/board.json")
          echo "board_id=$board_id" >> "$GITHUB_OUTPUT"
          image="$board_id-v1-$RKDEV_PROFILE-$version"
          python3 .rkdev/tools/rkdev.py verify --board "$board" --profile "$RKDEV_PROFILE" --image "out/$image.img"
      - name: Package verified firmware
        env:
          RKDEV_BOARD_ID: ${{ steps.image.outputs.board_id }}
          RKDEV_PROFILE: ${{ steps.firmware.outputs.profile }}
          RKDEV_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 ci/package_release.py --out out --board "$RKDEV_BOARD" \
            --board-id "$RKDEV_BOARD_ID" --profile "$RKDEV_PROFILE" --version "$RKDEV_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: rkdev-${{ inputs.board }}-${{ steps.firmware.outputs.profile }}
          compression-level: 0
          path: |
            out/*.zip
            out/SHA256SUMS
            out/u-boot-rockchip*.bin
            out/build.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rkdev-${{ inputs.board }}-failed-build-log
          path: out/build.log
          if-no-files-found: ignore

  release:
    name: 发布 ${{ inputs.board }}
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: rkdev-release-${{ inputs.board }}-${{ needs.build.outputs.profile }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rkdev-${{ inputs.board }}-${{ needs.build.outputs.profile }}
          path: release
      - name: Publish board firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RKDEV_BOARD: ${{ inputs.board }}
          RKDEV_BOARD_ID: ${{ needs.build.outputs.board_id }}
          RKDEV_PROFILE: ${{ needs.build.outputs.profile }}
          RKDEV_VERSION: ${{ needs.build.outputs.version }}
          RKDEV_BUILD_DATE: ${{ needs.build.outputs.build_date }}
        working-directory: release
        run: python3 ../ci/publish_release.py
