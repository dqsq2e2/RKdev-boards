name: 按板型构建并发布
run-name: 构建 ${{ inputs.board }} · ${{ inputs.profile }}

on:
  workflow_dispatch:
    inputs:
      board:
        description: 要构建的板型
        type: choice
        required: true
        options:
          - bdy-g98
          - phx-r3588
          - i3588
          - aiui
          - aiot-3588a2
          - bq3588c
      profile:
        description: 启动介质（default 使用板包默认值）
        type: choice
        required: true
        default: default
        options:
          - default
          - spi
          - emmc
      version:
        description: 镜像版本（留空自动生成）
        type: string
      publish:
        description: 构建成功后发布
        type: boolean
        default: true
      firmware_bundle_url:
        description: 外部固件 ZIP 的 HTTPS 地址（可选）
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 构建 ${{ inputs.board }}
    runs-on: ${{ inputs.board == 'bq3588c' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 80
    env:
      RKDEV_BOARD: ${{ inputs.board }}
      RKDEV_PROFILE_INPUT: ${{ inputs.profile }}
    outputs:
      profile: ${{ steps.firmware.outputs.profile }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-rkdev
      - name: Lint selected board package
        shell: bash
        run: |
          args=(lint --board "boards/$RKDEV_BOARD/v1")
          if [[ "$RKDEV_PROFILE_INPUT" != default ]]; then
            args+=(--profile "$RKDEV_PROFILE_INPUT")
          fi
          python3 .rkdev/tools/rkdev.py "${args[@]}"
      - name: Resolve profile and verify board firmware
        id: firmware
        env:
          RKDEV_FIRMWARE_BUNDLE_URL: ${{ inputs.firmware_bundle_url || secrets.RKDEV_FIRMWARE_BUNDLE_URL }}
        run: |
          profile=$(python3 ci/firmware_bundle.py --rkdev .rkdev --board "boards/$RKDEV_BOARD/v1" \
            --profile "$RKDEV_PROFILE_INPUT" --out "$RUNNER_TEMP/firmware")
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: .rkdev/recovery/app/go.mod
          cache-dependency-path: .rkdev/recovery/app/go.sum
      - uses: docker/setup-qemu-action@v3
        if: inputs.board == 'bq3588c'
        with:
          platforms: arm64
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl bc bison flex \
            libssl-dev libgnutls28-dev libelf-dev libncurses-dev pkg-config \
            device-tree-compiler python3-dev python3-pyelftools python3-setuptools swig \
            u-boot-tools gdisk util-linux e2fsprogs cpio pigz xz-utils lz4 kmod zstd rsync
          if [[ "$RKDEV_BOARD" == bq3588c ]]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          fi
      - name: Build U-Boot and recovery image
        id: image
        env:
          RKDEV_PROFILE: ${{ steps.firmware.outputs.profile }}
          RKDEV_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version=${RKDEV_VERSION:-0.1-ci.$GITHUB_RUN_NUMBER}
          git check-ref-format "refs/tags/$RKDEV_BOARD-$RKDEV_PROFILE-v$version"
          board="boards/$RKDEV_BOARD/v1"
          cross=
          if [[ "$RKDEV_BOARD" == bq3588c ]]; then
            cross=aarch64-linux-gnu-
          fi
          mkdir -p out
          sudo env "PATH=$PATH" python3 -u .rkdev/tools/rkdev.py build --locked \
            --board "$board" --profile "$RKDEV_PROFILE" --version "$version" --cross-compile="$cross" \
            --firmware-dir "$RUNNER_TEMP/firmware" --jobs "$(nproc)" --out out \
            2>&1 | tee out/build.log
          image="$RKDEV_BOARD-v1-$RKDEV_PROFILE-$version"
          python3 .rkdev/tools/rkdev.py verify --board "$board" --profile "$RKDEV_PROFILE" --image "out/$image.img"
          (
            cd out
            # The build ran under sudo; replace its checksum file from the runner-owned directory.
            {
              cat SHA256SUMS
              sha256sum "$image.json" u-boot-rockchip*.bin
            } > SHA256SUMS.release
            sha256sum --check SHA256SUMS.release
            mv -f -- SHA256SUMS.release SHA256SUMS
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rkdev-${{ inputs.board }}-${{ steps.firmware.outputs.profile }}
          path: |
            out/*.img
            out/*.json
            out/SHA256SUMS
            out/u-boot-rockchip*.bin
            out/build.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rkdev-${{ inputs.board }}-failed-build-log
          path: out/build.log
          if-no-files-found: ignore

  release:
    name: 发布 ${{ inputs.board }}
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: rkdev-release-${{ inputs.board }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rkdev-${{ inputs.board }}-${{ needs.build.outputs.profile }}
          path: release
      - name: Publish board firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RKDEV_BOARD: ${{ inputs.board }}
          RKDEV_PROFILE: ${{ needs.build.outputs.profile }}
          RKDEV_VERSION: ${{ needs.build.outputs.version }}
        working-directory: release
        run: python3 ../ci/publish_release.py
