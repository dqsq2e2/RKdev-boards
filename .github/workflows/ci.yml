name: RKdev board builds

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      board:
        description: Board package to build
        type: choice
        required: true
        options:
          - bdy-g98
          - phx-r3588
          - i3588
          - aiui
          - aiot-3588a2
      profile:
        description: Storage profile
        type: choice
        default: default
        options:
          - default
          - spi
          - emmc
      version:
        description: Image version (empty uses the workflow run number)
        type: string
      firmware_bundle_url:
        description: Optional public HTTPS firmware ZIP (use the secret for private URLs)
        type: string

permissions:
  contents: read

env:
  RKDEV_REF: 898a514cf5b22495dba31de7a936dd5efc1f1f67

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [bdy-g98, phx-r3588, i3588, aiui, aiot-3588a2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dqsq2e2/RKdev
          ref: ${{ env.RKDEV_REF }}
          path: .rkdev
          persist-credentials: false
      - env:
          RKDEV_BOARD: ${{ matrix.board }}
        run: python3 .rkdev/tools/rkdev.py lint --board "boards/$RKDEV_BOARD/v1"

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 80
    env:
      RKDEV_BOARD: ${{ inputs.board }}
    outputs:
      profile: ${{ steps.firmware.outputs.profile }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dqsq2e2/RKdev
          ref: ${{ env.RKDEV_REF }}
          path: .rkdev
          persist-credentials: false
      - name: Resolve profile and verify board firmware
        id: firmware
        env:
          RKDEV_PROFILE: ${{ inputs.profile }}
          RKDEV_FIRMWARE_BUNDLE_URL: ${{ inputs.firmware_bundle_url || secrets.RKDEV_FIRMWARE_BUNDLE_URL }}
        run: |
          profile=$(python3 ci/firmware_bundle.py --rkdev .rkdev --board "boards/$RKDEV_BOARD/v1" \
            --profile "$RKDEV_PROFILE" --out "$RUNNER_TEMP/firmware")
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: .rkdev/recovery/app/go.mod
          cache-dependency-path: .rkdev/recovery/app/go.sum
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl bc bison flex \
            libssl-dev libgnutls28-dev libelf-dev libncurses-dev pkg-config \
            device-tree-compiler python3-dev python3-pyelftools python3-setuptools swig \
            u-boot-tools gdisk util-linux e2fsprogs cpio pigz xz-utils lz4 kmod zstd rsync
      - name: Build U-Boot and recovery image
        id: image
        env:
          RKDEV_PROFILE: ${{ steps.firmware.outputs.profile }}
          RKDEV_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version=${RKDEV_VERSION:-0.1-ci.$GITHUB_RUN_NUMBER}
          git check-ref-format "refs/tags/$RKDEV_BOARD-$RKDEV_PROFILE-v$version"
          board="boards/$RKDEV_BOARD/v1"
          mkdir -p out
          sudo env "PATH=$PATH" python3 -u .rkdev/tools/rkdev.py build --locked \
            --board "$board" --profile "$RKDEV_PROFILE" --version "$version" --cross-compile= \
            --firmware-dir "$RUNNER_TEMP/firmware" --jobs "$(nproc)" --out out \
            2>&1 | tee out/build.log
          image="out/$RKDEV_BOARD-v1-$RKDEV_PROFILE-$version.img"
          python3 .rkdev/tools/rkdev.py verify --board "$board" --profile "$RKDEV_PROFILE" --image "$image"
          (cd out && sha256sum u-boot-rockchip*.bin >> SHA256SUMS && sha256sum --check SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rkdev-${{ inputs.board }}-${{ steps.firmware.outputs.profile }}
          path: |
            out/*.img
            out/*.json
            out/SHA256SUMS
            out/u-boot-rockchip*.bin
            out/build.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rkdev-${{ inputs.board }}-failed-build-log
          path: out/build.log
          if-no-files-found: ignore

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rkdev-${{ inputs.board }}-${{ needs.build.outputs.profile }}
          path: release
      - name: Publish board firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RKDEV_BOARD: ${{ inputs.board }}
          RKDEV_PROFILE: ${{ needs.build.outputs.profile }}
          RKDEV_VERSION: ${{ needs.build.outputs.version }}
        working-directory: release
        shell: bash
        run: |
          sha256sum --check SHA256SUMS
          tag="$RKDEV_BOARD-$RKDEV_PROFILE-v$RKDEV_VERSION"
          image="$RKDEV_BOARD-v1-$RKDEV_PROFILE-$RKDEV_VERSION"
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
            --title "$RKDEV_BOARD · $RKDEV_PROFILE · $RKDEV_VERSION" \
            --notes '完整启动镜像，包含主线 U-Boot 和 RKdev 恢复系统。' \
            "$image.img" "$image.json" SHA256SUMS u-boot-rockchip*.bin
