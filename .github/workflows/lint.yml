name: 检查全部板包

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ci -p 'test_*.py'

  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {board: bdy-g98, profile: spi}
          - {board: bdy-g98, profile: emmc}
          - {board: phx-r3588, profile: emmc}
          - {board: 9tripod-i3588, profile: emmc}
          - {board: aiui-3588, profile: emmc}
          - {board: aiot-3588a2, profile: emmc}
          - {board: bearkey-bq3588c, profile: emmc}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-rkdev
      - env:
          RKDEV_BOARD: ${{ matrix.board }}
          RKDEV_PROFILE: ${{ matrix.profile }}
        run: python3 .rkdev/tools/rkdev.py lint --board "boards/$RKDEV_BOARD/v1" --profile "$RKDEV_PROFILE"
