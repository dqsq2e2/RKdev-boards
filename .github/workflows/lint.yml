name: 检查全部板包

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ci -p 'test_*.py'

  lint:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [bdy-g98, phx-r3588, 9tripod-i3588, aiui-3588, aiot-3588a2, bearkey-bq3588c]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-rkdev
      - env:
          RKDEV_BOARD: ${{ matrix.board }}
        run: python3 .rkdev/tools/rkdev.py lint --board "boards/$RKDEV_BOARD/v1"
